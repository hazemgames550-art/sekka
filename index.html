<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>سكة واحدة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: one narrow column like a lantern-lit storybook page; a single committed night look. */
:root{
  --night:#0d1424;      /* page */
  --deep:#141d33;       /* cards */
  --line:#26314f;       /* hairlines */
  --moon:#efe6d2;       /* main text, moonlit paper */
  --mist:#9aa3bd;       /* secondary text */
  --lantern:#e8a948;    /* accent: lantern light */
  --p1:#7fb3e6;         /* لون صاحب الأوضة */
  --p2:#e79ab5;         /* لون اللاعب التاني */
  --good:#8fd1a8;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--moon)}
body{font-family:var(--body);font-size:16px;line-height:1.85;direction:rtl;text-align:right;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:radial-gradient(ellipse 120% 60% at 50% -10%,#1d2a4a 0%,transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:0;line-height:1.2;color:var(--moon)}
.brand small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--mist)}
.moon{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle at 38% 38%,#fff8e6,#e9d9b4 55%,#b9a77f);box-shadow:0 0 28px 6px rgba(232,169,72,.18)}
.who{font-size:13px;color:var(--mist)}
.who b{font-weight:600}
.h{color:var(--p1)} .r{color:var(--p2)}
.card{background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0 0 4px;color:var(--lantern)}
p{margin:0}
.muted{color:var(--mist);font-size:14px}
.stories{display:grid;gap:12px}
.story{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .2s,transform .2s}
.story:hover,.story:focus-visible{border-color:var(--lantern);transform:translateY(-1px)}
.story:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.story .em{font-size:30px;grid-row:span 2;line-height:1.3}
.story .t{font-family:var(--display);font-size:19px;font-weight:700}
.story .d{color:var(--mist);font-size:14px;line-height:1.7}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mist)}
.bar{flex:1;height:8px;border-radius:8px;background:#0a0f1c;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--lantern),var(--p2));transition:width .8s ease}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.steps span{width:18px;height:6px;border-radius:4px;background:var(--line)}
.steps span.done{background:var(--lantern)}
.steps span.now{background:var(--moon)}
.scene p.text{font-size:17px;line-height:2}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{all:unset;cursor:pointer;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#10182c;font-weight:500;transition:border-color .2s,background .2s}
.opt:hover,.opt:focus-visible{border-color:var(--lantern);background:#18223c}
.opt:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.opt.mine{border-color:var(--lantern);background:#2a2412}
.wait{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mist);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lantern);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.reveal{border-color:#3a4566}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pick{border-radius:10px;padding:10px 12px;background:#0f1628;border:1px solid var(--line);font-size:14px;min-width:0}
.pick .n{font-weight:600;font-size:13px}
.verdict{font-weight:600;margin-bottom:6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--p2)}
.flip{animation:flip .6s ease both}
@keyframes flip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
textarea{width:100%;box-sizing:border-box;min-height:96px;resize:vertical;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f1628;color:var(--moon);font:inherit;line-height:1.8}
textarea:focus{outline:2px solid var(--lantern);outline-offset:1px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--lantern);color:#1b1305;font-weight:600}
.btn:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--mist);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pocket{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mist);border:1px dashed #4a4630;border-radius:12px;padding:12px;background:#151a22}
.pocket b{color:var(--lantern);font-weight:600}
.answers{display:grid;gap:10px;margin-top:12px}
.ans{border-radius:12px;padding:12px;background:#0f1628;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.ans .n{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--mist);font-size:14px}
.log{display:grid;gap:10px;margin-top:10px;font-size:14px;color:#cfc6b2}
.log div{border-right:2px solid var(--line);padding-right:10px}
.end{text-align:center}
.end .pct{font-family:var(--display);font-size:54px;color:var(--lantern);line-height:1.1}
.end h2{margin-top:6px}
.hist{display:grid;gap:8px;margin-top:8px}
.hist div{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.hist div span:last-child{color:var(--lantern);font-variant-numeric:tabular-nums}
.confirm{margin-top:10px;font-size:14px}
.err{color:var(--p2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.field{display:grid;gap:6px}
.field label{font-size:14px;color:var(--mist)}
input[type=text],input[type=tel]{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0f1628;color:var(--moon);font:inherit}
input:focus{outline:2px solid var(--lantern);outline-offset:1px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#10182c;font-size:14px}
.seg button.on{border-color:var(--lantern);background:#2a2412;color:var(--lantern)}
.seg button:focus-visible{outline:2px solid var(--lantern)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.story.on{border-color:var(--lantern);background:#1d1a12}
.code{font-family:var(--display);font-size:46px;letter-spacing:6px;color:var(--lantern);text-align:center;direction:ltr}
.link{direction:ltr;text-align:left;font-size:13px;color:var(--mist);word-break:break-all;background:#0f1628;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.net{font-size:12px;color:var(--mist);display:flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.net.off i{background:var(--p2)}
.timer{font-variant-numeric:tabular-nums;color:var(--lantern);font-weight:600}
a.btn{text-decoration:none}

/* شريط الصوت والجو تحت */
body.hasdock{padding-bottom:150px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:rgba(13,20,36,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.dock .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.ib{all:unset;cursor:pointer;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#10182c;border:1px solid var(--line);position:relative;transition:box-shadow .15s,border-color .2s}
.ib:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.ib.on{border-color:var(--good);background:#13261c}
.ib.off{opacity:.75}
.ib.off::after{content:'';position:absolute;width:28px;height:2px;background:var(--p2);transform:rotate(-45deg);border-radius:2px}
.ib.talk{box-shadow:0 0 0 4px rgba(143,209,168,.45)}
.vs{flex:1;min-width:0;font-size:12px;color:var(--mist);line-height:1.5}
.vs .l1{color:var(--moon)}
.vs .od{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-end:5px;vertical-align:middle;transition:background .15s,box-shadow .15s}
.vs .od.talk{background:var(--good);box-shadow:0 0 0 3px rgba(143,209,168,.35)}
.vs button{all:unset;cursor:pointer;color:var(--lantern);text-decoration:underline;margin-inline-start:6px}
.rxbar{max-width:560px;margin:0 auto 10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rxbar button{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:7px 9px;border-radius:12px;background:#10182c;border:1px solid var(--line)}
.rxbar button:active{transform:scale(.9)}
.fly{position:fixed;bottom:110px;font-size:40px;line-height:1;pointer-events:none;z-index:30;animation:fly 2.6s ease-out forwards}
.fly small{display:block;font-size:11px;text-align:center;font-family:var(--body);margin-top:2px}
@keyframes fly{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.15)}100%{transform:translateY(-330px) scale(1);opacity:0}}
.ver{text-align:center;font-size:11px;color:#4d5878}

</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><p class="muted">بيفتح…</p></div></div>
<div id="dock" class="dock" hidden></div>
<audio id="rau" autoplay playsinline></audio>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
const STORIES = {
  island: {
    em: '🏝', title: 'الجزيرة',
    blurb: 'صحيتوا على شط جزيرة مش عارفين جيتوا إزاي، وفيه رسايل متسابة ليكم.',
    intro: 'صحيتوا على صوت موج. رملة دافية، وسما رمادي، ومركب صغير مكسور على الشط. محدش فيكم فاكر جه هنا إزاي. وجنب كل واحد فيكم ورقة مطبّقة مكتوب عليها اسم التاني، بخط إيد محدش يعرفه.',
    items: ['بوصلة صغيرة، إبرتها مش بتشاور على الشمال، بتشاور على حاجة جوه الجزيرة', 'صورة قديمة ليكم إنتوا الاتنين، في مكان عمركم ما رحتوه', 'مفتاح نحاس صغير محفور عليه رقم 7', 'ولّاعة قديمة محفور عليها اسم مركب: «النورس»'],
    scenes: [
      { t: 'الشمس بتغيب بسرعة غريبة، والهوا بقى ساقع. لازم تقرروا تعملوا إيه قبل الضلمة.',
        o: [
          { t: 'نولّع نار على الشط', s: 'لمّيتوا خشب من المركب المكسور وولّعتوا نار. الدفا رجّع لكم شوية أمان، ومن بعيد حد ولّع نار تانية كأنه بيرد عليكم.' },
          { t: 'ندخل الغابة ندوّر على مكان نبات فيه', s: 'لقيتوا تجويف في صخرة كبيرة جوه الغابة. على حيطته متشخبط سهم ومكتوب جنبه: «مش أول مرة».' },
          { t: 'نفتّش المركب المكسور', s: 'تحت الألواح لقيتوا شنطة مية وبطانية، وكراسة مبلولة آخر صفحة فيها: «لو قريتوا ده، يبقى لسه فيه وقت».' } ],
        d: 'كل واحد شد في ناحية، ولقيتوا نفسكم بتنادوا على بعض في الضلمة لحد ما اتلميتوا تاني. الجزيرة دي واضح إنها مش بتحب حد يمشي لوحده.' },
      { t: 'الصبح لقيتوا أثر رجلين على الرملة، طالع من البحر ورايح ناحية الصخور. حد كان واقف جنبكم وإنتوا نايمين.',
        o: [
          { t: 'نمشي ورا الأثر', s: 'الأثر وقف فجأة عند صخرة عليها نفس الخط اللي على الورقتين: «إنتوا قريبين».' },
          { t: 'نستخبى ونراقب', s: 'استخبيتوا ساعة. محدش جه، بس الأثر اتمسح لوحده قدام عينيكم، من غير موج.' },
          { t: 'ننادي بصوت عالي', s: 'ناديتوا. الصدى رجع بصوت مختلف، ونطق اسم كل واحد فيكم بالعكس.' } ],
        d: 'اختلفتوا، وواحد فيكم بص على الأثر والتاني بص على البحر. في اللحظة دي شفتوا الاتنين نفس الحاجة من مكانين مختلفين: خيال طويل بيبص عليكم من فوق الصخور.' },
      { t: 'جوه الغابة لقيتوا صندوق خشب عليه قفل بأرقام، تلات خانات. ورا الورقتين اللي معاكم أرقام ممسوحة نصها.',
        o: [
          { t: 'نجمع نص الرقم ده على نص الرقم ده ونجرّب', s: 'الرقمين مع بعض كمّلوا بعض: 7… 1… 4. القفل فتح، وجوه الصندوق خريطة للجزيرة، فيها فنار متعلّم عليه بقلب صغير.' },
          { t: 'نسيبه ونكمّل', s: 'سيبتوه. وإنتوا ماشيين سمعتوا القفل بيتفتح لوحده من وراكم. لما رجعتوا لقيتوا الصندوق فاضي وعليه ورقة: «المرة الجاية».' },
          { t: 'نشيله معانا', s: 'الصندوق كان أخف من المتوقع، وكان بيخبط خبطة خفيفة من جوه كأنه بيرد على خطواتكم.' } ],
        d: 'واحد عايز يفتح والتاني عايز يمشي. اتخانقتوا خناقة صغيرة، وبعدها ضحكتوا لما القفل فتح لوحده من غير ما حد يلمسه.' },
      { t: 'بالليل سمعتوا مزيكا جاية من جوه الجزيرة. أغنية قديمة حد فيكم سمعها قبل كده، ومش فاكر فين.',
        o: [
          { t: 'نروح ناحية الصوت', s: 'وصلتوا لساحة فيها جرامافون شغال لوحده. أول ما قربتوا الأغنية وقفت، وبدأت أغنية تانية، أغنية بتحبها {G}.' },
          { t: 'نبعد عن الصوت', s: 'بعدتوا، بس الصوت فضل ماشي معاكم بنفس المسافة. لحد ما وقفتوا، فوقف.' },
          { t: 'نقعد نسمع من مكاننا لحد الصبح', s: 'قعدتوا جنب بعض تسمعوا. ومع آخر أغنية حسيتوا إن الجزيرة نفسها هديت.' } ],
        d: 'كل واحد كان عايز حاجة. وفي الآخر الأغنية هي اللي قررت عنكم: سكتت، وفضل صوت الموج والكلام اللي بينكم.' },
      { secret: true, t: 'قعدتوا ترتاحوا جنب نار صغيرة. كل واحد فيكم حاسس بالحاجة اللي في جيبه من ساعة ما صحي، وكأنها بتتقل.',
        o: [ { t: 'أطلّع اللي في جيبي وأوريه' }, { t: 'أخليها معايا دلوقتي' } ] },
      { comp: true, t: 'وصلتوا للفنار. السلم الحديد مكسور من النص. واحد بس يقدر يطلع على كتف التاني، والتاني لازم يفضل تحت ويسنده.',
        o: [ { t: 'أنا اللي أطلع' }, { t: 'أنا اللي أسند' } ],
        good: 'واحد طلع والتاني سند، من غير كلام كتير. فوق لقيتوا نور الفنار لسه شغال، كأنه كان مستنيكم.',
        bad: 'الاتنين عملوا نفس الحاجة، فوقفتوا قدام السلم مش عارفين. أخدتوا وقت لحد ما اتفقتوا، والنور فوق اتطفى ورجع ولّع كأنه بيستعجلكم.' },
      { t: 'فوق في الفنار دفتر قديم، مكتوب في أول صفحة: «اللي يوصلوا هنا مع بعض، يمشوا من هنا مع بعض». وتحته أسامي كتير.',
        o: [
          { t: 'نكتب أسامينا جنب بعض', s: 'كتبتوا أسامينا. الحبر لمع لحظة، والدفتر قلب لوحده لصفحة بيضا عليها رسمة لمركب.' },
          { t: 'ناخد الصفحة معانا', s: 'قطعتوا الصفحة وطبقتوها. وإنتوا نازلين لاحظتوا إن الأسامي اللي فيها بقت أقل.' },
          { t: 'نسيب الدفتر زي ما هو', s: 'سيبتوه مفتوح. الهوا قلّب صفحاته، ووقف عند صفحة مكتوب فيها بخط جديد: «{H} و{G}، قريب».' } ],
        d: 'واحد مد إيده للقلم والتاني مد إيده للدفتر، وإيديكم خبطت في بعض. الدفتر وقع مفتوح على صفحة فيها رسمة لاتنين واقفين على نفس الشط.' },
      { t: 'الفجر. مركب صغير بشراع أبيض بيقرّب من الشط، ومحدش فيه.',
        o: [
          { t: 'نجري عليه مع بعض', s: 'ركبتوا، والمركب اتحرك لوحده ناحية الشمس.' },
          { t: 'نستنى ونشوف مين اللي بعته', s: 'استنيتوا. المركب وقف قدامكم بالظبط، وكأنه هو كمان مستنيكم تقرروا.' },
          { t: 'نرجع للفنار', s: 'رجعتوا الفنار. من فوق شفتوا المركب بيلف حوالين الجزيرة مرة، ومشي، وساب على الشط حاجة بتلمع.' } ],
        d: 'اختلفتوا في آخر لحظة. وقفتوا على الشط تبصوا لبعض، والمركب فضل مستني، مش هيمشي من غير الاتنين.' }
    ],
    qs: [
      'لو المغامرة دي حقيقية، إيه أكتر حاجة كانت هتخوّفك فيها؟',
      'إيه حاجة صغيرة بتفرّحك، وناس كتير ما تاخدش بالها منها؟',
      'لو هتاخد حاجة واحدة بس معاك على جزيرة، هتكون إيه وليه؟'
